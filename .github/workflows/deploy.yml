name: Production Build & Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20.x"
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Astro writes fingerprinted CSS/JS chunks to dist/_assets — safe to cache forever
      - name: Deploy hashed assets (immutable cache)
        run: |
          aws s3 sync dist/_assets s3://wireedmpro.com.au-032331960224-ap-southeast-2-an/_assets \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

      # Images and fonts are not fingerprinted, but changed files always ship
      # under new names - safe to cache for 30 days. cp (not sync) so existing
      # objects get their Cache-Control metadata refreshed too
      - name: Deploy images & fonts (30-day cache)
        run: |
          aws s3 cp dist/ s3://wireedmpro.com.au-032331960224-ap-southeast-2-an/ \
            --recursive \
            --exclude "*" \
            --include "*.webp" \
            --include "*.png" \
            --include "*.jpg" \
            --include "*.jpeg" \
            --include "*.svg" \
            --include "*.ico" \
            --include "*.woff2" \
            --cache-control "public, max-age=2592000"

      - name: Deploy HTML (must-revalidate)
        run: |
          aws s3 sync dist/ s3://wireedmpro.com.au-032331960224-ap-southeast-2-an/ \
            --exclude "*" \
            --include "*.html" \
            --cache-control "public, max-age=0, must-revalidate"

      # Everything else (sitemap.xml, robots.txt, …) + cleanup of removed files
      - name: Deploy remaining files
        run: |
          aws s3 sync dist/ s3://wireedmpro.com.au-032331960224-ap-southeast-2-an/ \
            --delete \
            --exclude "_assets/*" \
            --cache-control "public, max-age=86400"
